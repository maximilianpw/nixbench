name: Benchmark tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    name: Harness and corpus
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap

      - name: Check Python syntax
        run: python3 -m py_compile bench.py nixbench/*.py tests/*.py

      - name: Check evaluator shell syntax
        run: |
          for check in tasks/*/tests/check.sh; do
            sh -n "$check"
          done

      - name: Run harness and corpus tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests -v

      - name: Verify checked corpus release
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 bench.py release-check --corpus-root . --json > /tmp/release-check.json

  site:
    name: Website
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: site

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable

      - name: Install website dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and test website
        run: pnpm test

      - name: Build website
        run: pnpm build
